# FORK: Voka CRM — produção (Hetzner) — Traefik TLS + rate limit + app + backup
name: voka-crm

services:
  traefik:
    # v3.5+ exigido: o Docker Engine 29 rejeita a API antiga do client do v3.1
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt

  server:
    image: voka-crm:latest
    build:
      context: ..
      dockerfile: packages/twenty-docker/twenty/Dockerfile
      # Sem target, o Docker builda o último stage (twenty-app-dev, all-in-one
      # de dev com Postgres/Redis embutidos). Produção usa o stage "twenty".
      target: twenty
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment: &app-env
      NODE_ENV: production
      SERVER_URL: https://${DOMAIN}
      PG_DATABASE_URL: postgres://voka:${PG_PASSWORD}@db:5432/voka
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${APP_SECRET}
      IS_MULTIWORKSPACE_ENABLED: ${IS_MULTIWORKSPACE_ENABLED:-false}
      # "logger" até o SMTP ser configurado; troque para "smtp" no .env
      EMAIL_DRIVER: ${EMAIL_DRIVER:-logger}
      EMAIL_SMTP_HOST: ${SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM:-}
      # CAPTCHA (Cloudflare Turnstile) — a validação do Twenty rejeita string
      # vazia, então o default precisa ser um driver válido, nunca "".
      CAPTCHA_DRIVER: ${CAPTCHA_DRIVER:-turnstile}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
    volumes:
      - server-data:/app/packages/twenty-server/.local-storage
    labels:
      - traefik.enable=true
      - traefik.http.routers.voka.rule=Host(`${DOMAIN}`) || HostRegexp(`^.+\.${DOMAIN}$`)
      - traefik.http.routers.voka.entrypoints=websecure
      - traefik.http.routers.voka.tls.certresolver=le
      - traefik.http.services.voka.loadbalancer.server.port=3000
      # Rate limit geral: 30 req/s por IP (burst 60)
      - traefik.http.middlewares.voka-rl.ratelimit.average=30
      - traefik.http.middlewares.voka-rl.ratelimit.burst=60
      - traefik.http.routers.voka.middlewares=voka-rl
      # Rate limit agressivo para auth: 5 req/s (burst 10) em /graphql via router dedicado
      - traefik.http.middlewares.voka-auth-rl.ratelimit.average=5
      - traefik.http.middlewares.voka-auth-rl.ratelimit.burst=10
      - traefik.http.routers.voka-auth.rule=(Host(`${DOMAIN}`) || HostRegexp(`^.+\.${DOMAIN}$`)) && Path(`/graphql`) && Method(`POST`)
      - traefik.http.routers.voka-auth.priority=50
      - traefik.http.routers.voka-auth.entrypoints=websecure
      - traefik.http.routers.voka-auth.tls.certresolver=le
      - traefik.http.routers.voka-auth.middlewares=voka-auth-rl
      - traefik.http.routers.voka-auth.service=voka

  worker:
    image: voka-crm:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      <<: *app-env
      # Só o server roda migrations/crons no boot — dois entrypoints em
      # paralelo num banco vazio corrompem a inicialização (race).
      DISABLE_DB_MIGRATIONS: 'true'
      DISABLE_CRON_JOBS_REGISTRATION: 'true'
    command: ['node', 'dist/queue-worker/queue-worker.js']
    volumes:
      - server-data:/app/packages/twenty-server/.local-storage

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: voka
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: voka
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U voka']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${PG_PASSWORD}
      RCLONE_CONFIG_HETZNER_TYPE: s3
      RCLONE_CONFIG_HETZNER_PROVIDER: Other
      RCLONE_CONFIG_HETZNER_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      RCLONE_CONFIG_HETZNER_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      RCLONE_CONFIG_HETZNER_ENDPOINT: ${S3_ENDPOINT}
      # Sem region, o CreateBucket manda us-east-1 e a Hetzner rejeita
      RCLONE_CONFIG_HETZNER_REGION: ${S3_REGION:-fsn1}
      S3_BUCKET: ${S3_BUCKET:-zellate-backups}
    volumes:
      - ./backup.sh:/backup.sh:ro
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        apk add --no-cache rclone >/dev/null 2>&1
        echo '0 3 * * * /bin/sh /backup.sh' > /etc/crontabs/root
        crond -f -l 2

volumes:
  traefik-certs:
  server-data:
  db-data:
